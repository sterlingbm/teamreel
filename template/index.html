<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&display=block" rel="stylesheet">
<style>
  :root {
    --ink: #0d1014; --ink2: #151a21; --line: #262d37; --paper: #f3efe7; --mute: #9aa3ae; --accent: #ff7a45;
    --add: #4fbf87; --del: #e5675c;
    --serif: 'Fraunces', Georgia, serif; --sans: 'Instrument Sans', -apple-system, Helvetica, sans-serif; --mono: 'IBM Plex Mono', Menlo, monospace;
    --u: calc(1vw * 1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--ink); color: var(--paper); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
  body.v { --u: calc(1vh * 0.5625); }

  #bg { position: absolute; inset: 0; overflow: hidden; }
  #glow { position: absolute; width: 90vmax; height: 90vmax; border-radius: 50%; filter: blur(40px);
    background: radial-gradient(circle, color-mix(in srgb, var(--accent) 22%, transparent) 0%, transparent 62%); }
  #grid { position: absolute; inset: -10%; opacity: .35;
    background-image: radial-gradient(color-mix(in srgb, var(--paper) 14%, transparent) 1.2px, transparent 1.3px); background-size: calc(var(--u) * 2.6) calc(var(--u) * 2.6); }

  #bar { position: absolute; top: calc(var(--u) * 1.6); left: calc(var(--u) * 5); right: calc(var(--u) * 5); display: flex; gap: calc(var(--u) * .5); z-index: 5; }
  #bar i { flex: 1; height: calc(var(--u) * .28); background: var(--line); border-radius: 9px; overflow: hidden; position: relative; }
  #bar i b { position: absolute; inset: 0; background: var(--paper); transform-origin: left; transform: scaleX(0); }

  .scene { position: absolute; inset: 0; padding: calc(var(--u) * 7) calc(var(--u) * 6) calc(var(--u) * 10); opacity: 0; display: flex; flex-direction: column; justify-content: center; }
  .kicker { font-family: var(--mono); font-size: calc(var(--u) * 1.35); letter-spacing: .08em; text-transform: uppercase; color: var(--mute); display: flex; align-items: center; gap: calc(var(--u) * 1); }
  .kicker::before { content: ''; width: calc(var(--u) * 2.6); height: 2px; background: var(--accent); }
  .serif { font-family: var(--serif); font-weight: 650; letter-spacing: -.02em; line-height: 1.02; font-variation-settings: 'opsz' 144; }
  .av { border-radius: 50%; object-fit: cover; background: var(--ink2); border: 2px solid var(--ink); }

  /* intro */
  .intro h1 { font-size: calc(var(--u) * 7.4); margin: calc(var(--u) * 2.2) 0 calc(var(--u) * 3.4); max-width: 15ch; text-wrap: balance; }
  .stack { display: flex; }
  .stack .av { width: calc(var(--u) * 4.6); height: calc(var(--u) * 4.6); margin-right: calc(var(--u) * -1.1); border: 3px solid var(--ink); }

  /* stats */
  .stats .grid { display: grid; grid-template-columns: repeat(var(--n), 1fr); gap: calc(var(--u) * 2); margin-top: calc(var(--u) * 3.4); }
  .stat { border-top: 2px solid var(--line); padding-top: calc(var(--u) * 1.6); }
  .stat .num { font-family: var(--serif); font-weight: 650; font-size: calc(var(--u) * 7.6); letter-spacing: -.03em; line-height: 1; font-variant-numeric: tabular-nums; }
  .stat .lbl { margin-top: calc(var(--u) * 1); color: var(--mute); font-size: calc(var(--u) * 1.6); }
  .stat:first-child .num { color: var(--accent); }

  /* hero */
  .hero .wrap { display: grid; grid-template-columns: 1.55fr 1fr; gap: calc(var(--u) * 5); align-items: center; margin-top: calc(var(--u) * 2.2); }
  .hero h2 { font-size: calc(var(--u) * 5); text-wrap: balance; }
  .hero ul { list-style: none; margin-top: calc(var(--u) * 2.8); display: grid; gap: calc(var(--u) * 1.3); }
  .hero li { font-size: calc(var(--u) * 1.9); line-height: 1.3; padding-left: calc(var(--u) * 2.2); position: relative; color: #dcd7cd; }
  .hero li::before { content: ''; position: absolute; left: 0; top: .55em; width: calc(var(--u) * .9); height: calc(var(--u) * .9); border-radius: 2px; background: var(--accent); }
  .card { background: var(--ink2); border: 1px solid var(--line); border-radius: calc(var(--u) * 1.4); padding: calc(var(--u) * 2.6); }
  .card .who { display: flex; align-items: center; gap: calc(var(--u) * 1.4); }
  .card .who .av { width: calc(var(--u) * 6); height: calc(var(--u) * 6); }
  .card .name { font-size: calc(var(--u) * 2.2); font-weight: 600; }
  .meta { font-family: var(--mono); color: var(--mute); font-size: calc(var(--u) * 1.25); margin-top: calc(var(--u) * .4); }
  .diff { margin-top: calc(var(--u) * 2.6); }
  .diff .track { display: flex; height: calc(var(--u) * 1.1); border-radius: 99px; overflow: hidden; background: var(--line); }
  .diff .a { background: var(--add); transform-origin: left; } .diff .d { background: var(--del); transform-origin: left; }
  .diff .nums { display: flex; justify-content: space-between; font-family: var(--mono); font-size: calc(var(--u) * 1.5); margin-top: calc(var(--u) * 1); }
  .nums .pa { color: var(--add); } .nums .pd { color: var(--del); }

  /* list */
  .list h2 { font-size: calc(var(--u) * 4.4); margin: calc(var(--u) * 1.6) 0 calc(var(--u) * 2.6); }
  .rows { display: grid; gap: calc(var(--u) * .9); }
  .row { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: calc(var(--u) * 1.6); padding: calc(var(--u) * 1.1) calc(var(--u) * 1.6); background: var(--ink2); border: 1px solid var(--line); border-radius: calc(var(--u) * 1); }
  .row .av { width: calc(var(--u) * 3.4); height: calc(var(--u) * 3.4); }
  .row .t { font-size: calc(var(--u) * 2); font-weight: 500; }
  .row .m { font-family: var(--mono); font-size: calc(var(--u) * 1.2); color: var(--mute); text-align: right; }

  /* shoutouts */
  .shout h2 { font-size: calc(var(--u) * 4.4); margin: calc(var(--u) * 1.6) 0 calc(var(--u) * 2.8); }
  .cards { display: grid; grid-template-columns: repeat(var(--n), 1fr); gap: calc(var(--u) * 1.8); }
  .shout .card { text-align: left; }
  .shout .card .av { width: calc(var(--u) * 7); height: calc(var(--u) * 7); border-color: var(--accent); }
  .shout .card .name { margin-top: calc(var(--u) * 1.6); }
  .shout .card .line { margin-top: calc(var(--u) * .8); color: #dcd7cd; font-size: calc(var(--u) * 1.7); line-height: 1.3; }

  /* outro */
  .outro { align-items: flex-start; }
  .outro h2 { font-size: calc(var(--u) * 7); margin: calc(var(--u) * 2) 0; max-width: 16ch; }
  .outro .repos { font-family: var(--mono); color: var(--mute); font-size: calc(var(--u) * 1.4); }
  .mark { position: absolute; right: calc(var(--u) * 6); bottom: calc(var(--u) * 3); font-family: var(--mono); font-size: calc(var(--u) * 1.1); color: #5d6672; }

  /* captions */
  #cap { position: absolute; left: 50%; bottom: calc(var(--u) * 3.4); transform: translateX(-50%); width: min(78%, 62ch); text-align: center; z-index: 6;
    font-size: calc(var(--u) * 1.75); line-height: 1.35; font-weight: 500; }
  #cap span { background: rgba(8, 10, 13, .78); padding: .12em .45em; border-radius: 6px; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
  #cap .dim { color: #6c7480; }

  /* vertical: same type scale, bigger unit, stacked layouts */
  body.v { --u: calc(1vw * 1.62); }
  body.v .scene { padding: calc(var(--u) * 12) calc(var(--u) * 5) calc(var(--u) * 20); }
  body.v .intro h1 { font-size: calc(var(--u) * 8.4); }
  body.v .stats .grid { grid-template-columns: 1fr 1fr; row-gap: calc(var(--u) * 4); }
  body.v .hero .wrap { grid-template-columns: 1fr; gap: calc(var(--u) * 3); }
  body.v .hero h2 { font-size: calc(var(--u) * 5.6); }
  body.v .row { grid-template-columns: auto 1fr; }
  body.v .row .m { display: none; }
  body.v .cards { grid-template-columns: 1fr 1fr; }
  body.v #cap { bottom: calc(var(--u) * 9); width: 88%; font-size: calc(var(--u) * 2.2); }
</style>
</head>
<body>
<div id="bg"><div id="glow"></div><div id="grid"></div></div>
<div id="bar"></div>
<div id="stage"></div>
<div id="cap"></div>
<script>
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const clamp = (x) => Math.max(0, Math.min(1, x));
const ease = (x) => 1 - Math.pow(1 - clamp(x), 3);
const expo = (x) => (x >= 1 ? 1 : 1 - Math.pow(2, -10 * clamp(x)));
const fmt = (n) => Math.round(n).toLocaleString('en-US');

let S, AV = {};
const av = (login, cls = 'av') => AV[login] ? `<img class="${cls}" src="${AV[login]}">` : `<span class="${cls}" style="display:inline-grid;place-items:center;font-family:var(--mono);color:var(--mute)">${esc(login[0]?.toUpperCase())}</span>`;
// data-a: rise | fade | wipe | grow | count | pop ; data-d: delay (s) from scene start
const A = (a, d, extra = '') => `data-a="${a}" data-d="${d}" ${extra}`;

const BUILD = {
  intro: (s) => `
    <div class="kicker" ${A('fade', .15)}>${esc(s.kicker)}</div>
    <h1 class="serif" ${A('wipe', .35)}>${esc(s.headline)}</h1>
    <div class="stack">${s.people.map((p, i) => `<span ${A('pop', 1.1 + i * .07)}>${av(p)}</span>`).join('')}</div>`,
  stats: (s) => `
    <div class="kicker" ${A('fade', .1)}>The week in numbers</div>
    <div class="grid" style="--n:${s.items.length}">${s.items.map((it, i) => `
      <div class="stat" ${A('rise', .3 + i * .18)}><div class="num" ${A('count', .3 + i * .18, `data-to="${it.value}"`)}>0</div><div class="lbl">${esc(it.label)}</div></div>`).join('')}
    </div>`,
  hero: (s) => {
    const tot = Math.max(1, s.additions + s.deletions);
    return `
    <div class="kicker" ${A('fade', .1)}>The big one</div>
    <div class="wrap">
      <div>
        <h2 class="serif" ${A('wipe', .3)}>${esc(s.title)}</h2>
        <ul>${s.points.map((p, i) => `<li ${A('rise', 1.4 + i * 1.1)}>${esc(p)}</li>`).join('')}</ul>
      </div>
      <div class="card" ${A('rise', .8)}>
        <div class="who">${av(s.author)}<div><div class="name">${esc(s.name)}</div><div class="meta">#${s.number} · ${esc(s.repo)}</div></div></div>
        <div class="diff">
          <div class="track"><div class="a" style="width:${100 * s.additions / tot}%" ${A('grow', 1.4)}></div><div class="d" style="width:${100 * s.deletions / tot}%" ${A('grow', 1.9)}></div></div>
          <div class="nums"><span class="pa">+<span ${A('count', 1.4, `data-to="${s.additions}"`)}>0</span></span><span class="pd">−<span ${A('count', 1.9, `data-to="${s.deletions}"`)}>0</span></span></div>
        </div>
      </div>
    </div>`;
  },
  list: (s) => `
    <div class="kicker" ${A('fade', .1)}>${s.items.length} more merged</div>
    <h2 class="serif" ${A('wipe', .25)}>${esc(s.heading)}</h2>
    <div class="rows">${s.items.map((it, i) => `
      <div class="row" ${A('rise', .8 + i * .32)}>${av(it.author)}<div class="t">${esc(it.title)}</div><div class="m">#${it.number} · ${esc(it.name)}</div></div>`).join('')}
    </div>`,
  shoutouts: (s) => `
    <div class="kicker" ${A('fade', .1)}>Shout-outs</div>
    <h2 class="serif" ${A('wipe', .25)}>Thank you</h2>
    <div class="cards" style="--n:${s.people.length}">${s.people.map((p, i) => `
      <div class="card" ${A('rise', .8 + i * .45)}>${av(p.login)}<div class="name">${esc(p.name)}</div>${p.line ? `<div class="line">${esc(p.line)}</div>` : ''}<div class="meta">${p.prs} PR${p.prs === 1 ? '' : 's'} merged</div></div>`).join('')}
    </div>`,
  outro: (s) => `
    <div class="kicker" ${A('fade', .1)}>${esc(S.range)}</div>
    <h2 class="serif" ${A('wipe', .3)}>${esc(s.line)}</h2>
    <div class="repos" ${A('fade', 1.1)}>${esc((s.repos || []).slice(0, 4).join('  ·  '))}</div>`,
};

let scenes = [], bars = [], cap;
window.__build = (story, avatars, opts) => {
  S = story; AV = avatars || {};
  if (opts.vertical) document.body.classList.add('v');
  if (story.accent) document.documentElement.style.setProperty('--accent', story.accent);
  const stage = document.getElementById('stage');
  stage.innerHTML = story.scenes.map((s, i) => `<section class="scene ${s.type === 'shoutouts' ? 'shout' : s.type}" data-i="${i}">${BUILD[s.type](s)}${s.type === 'outro' && opts.mark ? '<div class="mark">made with teamreel</div>' : ''}</section>`).join('');
  scenes = [...stage.children].map((el, i) => ({ el, s: story.scenes[i], parts: [...el.querySelectorAll('[data-a]')] }));
  document.getElementById('bar').innerHTML = story.scenes.map(() => '<i><b></b></i>').join('');
  bars = [...document.querySelectorAll('#bar b')];
  cap = document.getElementById('cap');
  cap.style.display = opts.captions ? '' : 'none';
  return document.fonts.ready.then(() => Promise.all([...document.images].map((im) => im.decode().catch(() => {}))));
};

const FADE_IN = .5, FADE_OUT = .35;
function chunk(text) {
  const out = [];
  for (const sent of text.match(/[^.!?;:]+[.!?;:]*/g) ?? [text]) {
    const w = sent.trim().split(/\s+/).filter(Boolean);
    const parts = Math.ceil(w.length / 9), size = Math.ceil(w.length / parts);
    for (let i = 0; i < w.length; i += size) out.push({ text: w.slice(i, i + size).join(' '), n: w.slice(i, i + size).length });
  }
  return out.length ? out : [{ text, n: 1 }];
}
window.__seek = (t) => {
  const g = document.getElementById('glow');
  g.style.transform = `translate(${-20 + 18 * Math.sin(t * .11)}vmax, ${-35 + 10 * Math.cos(t * .08)}vmax)`;
  document.getElementById('grid').style.transform = `translate(${(-t * 6) % 50}px, ${(-t * 3) % 50}px)`;
  let capHtml = '';
  for (const [i, { el, s, parts }] of scenes.entries()) {
    const lt = t - s.start, len = s.end - s.start;
    bars[i].style.transform = `scaleX(${clamp(lt / len)})`;
    const on = lt >= 0 && lt < len;
    if (!on) { el.style.opacity = 0; continue; }
    const o = Math.min(ease(lt / FADE_IN), i === scenes.length - 1 ? 1 : clamp((len - lt) / FADE_OUT));
    el.style.opacity = o;
    el.style.transform = `translateY(${(1 - ease(lt / FADE_IN)) * 18}px)`;
    for (const p of parts) {
      const d = Number(p.dataset.d), a = p.dataset.a, x = lt - d;
      if (a === 'count') { p.textContent = fmt(Number(p.dataset.to) * expo(x / 1.4)); continue; }
      const k = ease(x / (a === 'grow' ? 1.0 : .7));
      if (a === 'fade') p.style.opacity = k;
      else if (a === 'rise') { p.style.opacity = k; p.style.transform = `translateY(${(1 - k) * 34}px)`; }
      else if (a === 'pop') { p.style.opacity = k; p.style.display = 'inline-block'; p.style.transform = `scale(${.6 + .4 * k})`; }
      else if (a === 'wipe') { p.style.clipPath = `inset(-10% ${(1 - ease(x / .9)) * 100}% -20% 0)`; }
      else if (a === 'grow') p.style.transform = `scaleX(${k})`;
    }
    if (s.narration && s.voStart != null && t >= s.voStart - .1) {
      // captions as short phrases, timed by word count across the voice-over
      s._chunks ??= chunk(s.narration);
      const total = s._chunks.reduce((a, c) => a + c.n, 0);
      let w = total * clamp((t - s.voStart) / Math.max(.5, s.voLen)), k = 0;
      while (k < s._chunks.length - 1 && w >= s._chunks[k].n) { w -= s._chunks[k].n; k++; }
      capHtml = `<span>${esc(s._chunks[k].text)}</span>`;
    }
  }
  if (cap.innerHTML !== capHtml) cap.innerHTML = capHtml;
};
</script>
</body>
</html>
