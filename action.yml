name: TeamReel
description: What every team shipped this week, as a short video posted to Slack.
branding: { icon: film, color: orange }
inputs:
  config: { description: 'Path to teamreel.json', required: false, default: 'teamreel.json' }
  since:  { description: 'Window, e.g. 7d or 2w', required: false, default: '7d' }
  post:   { description: 'Post to the config''s post_to channel', required: false, default: 'true' }
  vertical: { description: 'true for 1080x1920', required: false, default: 'false' }
outputs:
  video: { description: 'Path to the rendered mp4', value: '${{ steps.run.outputs.video }}' }
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with: { node-version: 22 }
    - shell: bash
      run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
    - shell: bash
      working-directory: ${{ github.action_path }}
      run: npm ci --omit=dev --no-audit --no-fund && npx playwright install --with-deps chromium
    - id: run
      shell: bash
      env:
        GITHUB_TOKEN: ${{ env.GITHUB_TOKEN || github.token }}
      run: |
        args=(--config "${{ inputs.config }}" --since "${{ inputs.since }}" --out "$RUNNER_TEMP/teamreel")
        [ "${{ inputs.post }}" = "true" ] && args+=(--post)
        [ "${{ inputs.vertical }}" = "true" ] && args+=(--vertical)
        node "${{ github.action_path }}/src/cli.mjs" "${args[@]}"
        echo "video=$RUNNER_TEMP/teamreel/teamreel.mp4" >> "$GITHUB_OUTPUT"
